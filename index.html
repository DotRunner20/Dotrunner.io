<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DotRunner: Street Sweep Run</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #121212; color: #fff; font-family: sans-serif; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        
        #overlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); 
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;
        }
        .btn { background: #00ff88; color: #000; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; font-size: 18px; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>DotRunner</h2>
        <p>Sta locatie toe om de kaart in jouw buurt te zien.</p>
        <button class="btn" onclick="startLocation()">Deel Locatie & Start</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([52.3676, 4.9041], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function startLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('overlay').style.display = 'none';
                        const loc = [pos.coords.latitude, pos.coords.longitude];
                        map.setView(loc, 18);
                        L.circleMarker(loc, {color: '#00ff88', radius: 8}).addTo(map);
                    },
                    (err) => {
                        alert("Locatie geweigerd. Klik op het icoontje in de adresbalk om toestemming te geven.");
                    },
                    { enableHighAccuracy: true }
                );
            }
        }
    </script>
</body>
</html>
